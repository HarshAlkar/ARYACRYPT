[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aryacrypt"
version = "1.1.0"
description = "AryaCrypt: TIVRA cryptographic security framework — Aryabhata password preprocessing with PBKDF2-HMAC-SHA256 and AES-256-GCM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "TIVRA" }]
maintainers = [{ name = "TIVRA" }]
keywords = ["cryptography", "aes-gcm", "pbkdf2", "aryabhata", "tivra"]
dependencies = [
  "cryptography>=42.0.0,<46",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
