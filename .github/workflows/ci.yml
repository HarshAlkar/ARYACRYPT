name: AryaCrypt CI

on:
  push:
    paths:
      - "python-sdk/**"
      - "node-sdk/**"
      - "backend/**"
      - "scripts/**"
      - "docs/spec/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "python-sdk/**"
      - "node-sdk/**"
      - "backend/**"
      - "scripts/**"
      - "docs/spec/**"
      - ".github/workflows/**"

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  node-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  cross-language:
    runs-on: ubuntu-latest
    needs: [python-sdk, node-sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install SDKs
        run: |
          pip install -e ./python-sdk
          cd node-sdk && npm ci && npm run build
      - name: Cross decrypt
        run: python scripts/cross_compat_test.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + SDK
        run: |
          pip install -e ../python-sdk
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Backend tests
        env:
          SECRET_KEY: pytest-only-strong-secret-key-32b-ok-xxxxxxxx
          POSTGRES_SERVER: localhost
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aryacrypt_test
          BACKEND_CORS_ORIGINS: http://localhost:5173
        run: pytest -q
